# XcodeGen spec — the source of truth for Baseline.xcodeproj.
#
# The checked-in Baseline.xcodeproj was generated from this file with XcodeGen
# 2.44.1 and opens as-is. To regenerate after changing this file:
#   brew install xcodegen && cd ios && xcodegen generate
name: Baseline
options:
  bundleIdPrefix: com.bardia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Baseline:
    type: application
    platform: iOS
    sources:
      # Swift sources: the app's own @main file plus the vendored shell.
      # Baseline runs the shell in remote mode (the live site, not a bundled
      # copy), so there is no App/Web folder and no folder reference for one.
      - path: App
        excludes:
          - "Assets.xcassets"
          - "Assets.xcassets/**"
          - "Info.plist"
      - path: App/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bardia.baseline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Baseline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}
