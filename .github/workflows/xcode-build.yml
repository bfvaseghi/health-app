name: Xcode build

# Builds the native shell app for the iOS Simulator and for Mac Catalyst
# without signing, so a broken project or Swift file is caught before anyone
# opens Xcode. Runs on demand, and on pushes to the branch that carries the
# native shell work when something under the ios folder changes. macOS
# minutes are billed at 10x on a private repository, so it does not run on
# every push to every branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/xcode-apps-ui-retention-ep2v4v]
    paths:
      - "ios/**"
      - .github/workflows/xcode-build.yml

jobs:
  xcode:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project Baseline.xcodeproj -scheme Baseline
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build | tail -n 60; test "${PIPESTATUS[0]}" -eq 0
      - name: Build for Mac Catalyst
        run: >-
          xcodebuild -project Baseline.xcodeproj -scheme Baseline
          -destination 'platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO build | tail -n 60; test "${PIPESTATUS[0]}" -eq 0
