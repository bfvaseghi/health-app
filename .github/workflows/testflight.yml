name: TestFlight

# Signs the app with your Apple Developer account and uploads it to
# TestFlight, so it installs on your phone from the TestFlight app with no
# cable and no Xcode. Runs on demand only. Needs four repository secrets
# (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID    your 10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID       an App Store Connect API key's Key ID (Users and Access →
#                    Integrations → App Store Connect API; role App Manager or Admin)
#   ASC_ISSUER_ID    the Issuer ID shown on the same page
#   ASC_KEY_P8       the downloaded AuthKey_<KEY_ID>.p8 file's full text
# and an app record in App Store Connect for the bundle identifier
# (My Apps → + → New App). Optional: DIST_CERT_P12 (base64 of an Apple
# Distribution .p12) and DIST_CERT_PASSWORD, to reuse one certificate instead
# of letting Xcode create one on the runner (a team may hold at most three).
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (see the comment at the top of this workflow)"; missing=1; fi
          done
          [ -z "${missing:-}" ]
      - name: Install the API key
        run: |
          mkdir -p ~/.private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Import a distribution certificate (optional)
        if: env.DIST_CERT_P12 != ''
        run: |
          echo "$DIST_CERT_P12" | base64 -d > dist.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          # Without this the keychain relocks after five minutes and a long
          # archive fails at the signing step with "User interaction is not
          # allowed"; six hours outlives any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import dist.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f dist.p12
      - name: Archive with automatic signing
        run: |
          xcodebuild -project ios/Baseline.xcodeproj -scheme Baseline \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Baseline.xcarchive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 || { tail -n 120 archive.log; exit 1; }
          grep -E "error:|\*\* ARCHIVE" archive.log || true
      - name: Export for App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Baseline.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { tail -n 80 export.log; exit 1; }
          ls -la build/export
      - name: Upload to TestFlight
        run: |
          ipa=$(ls build/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -n 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
