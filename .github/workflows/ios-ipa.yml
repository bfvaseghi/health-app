name: iOS build (IPA)

# Archives the app (with its widget extension) for a real iPhone without
# signing, packages it as an .ipa, and publishes it as a GitHub Release, so
# the app can be installed without Xcode by signing it with your own Apple ID
# (Sideloadly, AltStore) — see README-iOS.md, "Install without Xcode".
# Runs on demand and on pushes to main that touch the app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - .github/workflows/ios-ipa.yml

permissions:
  contents: write

# Two archives of the same branch would race for the same release tag.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Archive for iPhone (unsigned)
        run: |
          xcodebuild -project ios/Baseline.xcodeproj -scheme Baseline \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Baseline.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive > archive.log 2>&1 || { tail -n 80 archive.log; exit 1; }
          grep -E "error:|\*\* ARCHIVE" archive.log || true
      - name: Package the IPA
        run: |
          app=$(find build/Baseline.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $app"
          mkdir -p ipa/Payload out
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry "$GITHUB_WORKSPACE/out/Baseline-unsigned.ipa" Payload)
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          ls "$app/PlugIns" 2>/dev/null || echo "(no extensions)"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.ipa \
            --title "Baseline for iPhone, $tag" \
            --notes "Unsigned iOS build of Baseline (app and widget) from ${GITHUB_SHA::7}. Sign and install it with your own Apple ID using Sideloadly or AltStore (see ios/README-iOS.md, \"Install without Xcode\"), or open ios/Baseline.xcodeproj in Xcode and press Run."
